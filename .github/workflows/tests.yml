name: tests

# Только юнит-тесты (протокол, статистика, эко, формат записи). APK здесь не собирается:
# его собирают в Android Studio. Android SDK для этих тестов не нужен.
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JUnit 4
        run: sudo apt-get update && sudo apt-get install -y junit4 libhamcrest-java

      - name: Юнит-тесты
        run: bash tools/run-tests.sh
